; AppMixer - shows the real apps, volumes and active output from the helper's state file.
; Colors, fonts and icons are in Theme.inc, positions and sizes in Layout-full.inc or Layout-compact.inc.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
; The skin can only be dragged by its handle (see [GripHit]), and the helper only runs while the skin is loaded.
OnRefreshAction=[!Draggable 0]["#CURRENTPATH#Helper\AppMixerHelper.exe" watch]
OnCloseAction=["#CURRENTPATH#Helper\AppMixerHelper.exe" stop]
; The compact layout shows the pin and grip only while the cursor is over the panel.
MouseOverAction=[!CommandMeasure Mixer "PanelHover(1)"]
MouseLeaveAction=[!CommandMeasure Mixer "PanelHover(0)"]

; Right-click menu (Custom skin actions). A leading ">" marks the current choice (set by Mixer.lua).
ContextTitle=Layout: #MarkFull#Full
ContextAction=[!CommandMeasure Mixer "SetLayout('full')"]
ContextTitle2=Layout: #MarkCompact#Compact
ContextAction2=[!CommandMeasure Mixer "SetLayout('compact')"]
ContextTitle3=------
ContextTitle4=Accent: #MarkAuto#Windows accent
ContextAction4=[!CommandMeasure Mixer "SetAccent('auto')"]
ContextTitle5=Accent: #MarkBlue#Blue
ContextAction5=[!CommandMeasure Mixer "SetAccent('blue')"]
ContextTitle6=Accent: #MarkViolet#Violet
ContextAction6=[!CommandMeasure Mixer "SetAccent('violet')"]
ContextTitle7=Accent: #MarkGreen#Green
ContextAction7=[!CommandMeasure Mixer "SetAccent('green')"]
ContextTitle8=Accent: #MarkOrange#Orange
ContextAction8=[!CommandMeasure Mixer "SetAccent('orange')"]
ContextTitle9=Accent: #MarkPink#Pink
ContextAction9=[!CommandMeasure Mixer "SetAccent('pink')"]
ContextTitle10=Accent: #MarkRed#Red
ContextAction10=[!CommandMeasure Mixer "SetAccent('red')"]
ContextTitle11=Accent: #MarkCustom#Custom (edit file)...
ContextAction11=[!CommandMeasure Mixer "SetAccent('custom')"]
ContextTitle12=------
ContextTitle13=Opacity: #MarkOp100#100% (solid)
ContextAction13=[!CommandMeasure Mixer "SetOpacity(100)"]
ContextTitle14=Opacity: #MarkOp90#90%
ContextAction14=[!CommandMeasure Mixer "SetOpacity(90)"]
ContextTitle15=Opacity: #MarkOp80#80%
ContextAction15=[!CommandMeasure Mixer "SetOpacity(80)"]
ContextTitle16=Opacity: #MarkOp70#70%
ContextAction16=[!CommandMeasure Mixer "SetOpacity(70)"]
ContextTitle17=Opacity: #MarkOp60#60%
ContextAction17=[!CommandMeasure Mixer "SetOpacity(60)"]
ContextTitle18=Opacity: #MarkOp50#50%
ContextAction18=[!CommandMeasure Mixer "SetOpacity(50)"]
ContextTitle19=------
ContextTitle20=Open settings file
ContextAction20=[!CommandMeasure Mixer "EditSettings()"]

@Include=#CURRENTPATH#Theme.inc
; The user's choices from the menu, written by Mixer.lua (the file may not exist yet).
@Include2=#CURRENTPATH#Settings.inc
@Include3=#CURRENTPATH#Layout-#Layout#.inc

[Variables]
; Menu check marks, set by Mixer.lua
MarkFull=
MarkCompact=
MarkAuto=
MarkBlue=
MarkViolet=
MarkGreen=
MarkOrange=
MarkPink=
MarkRed=
MarkCustom=
MarkOp100=
MarkOp90=
MarkOp80=
MarkOp70=
MarkOp60=
MarkOp50=

; Layout values that Mixer.lua recomputes from the number of rows
DividerY=272
FooterY=286

; Per-slot values that Mixer.lua sets
MasterVol=0
MasterFill=#Accent#
Out1Fill=#ButtonColor#
Out2Fill=#ButtonColor#
Out3Fill=#ButtonColor#
R1Vol=0
R1Fill=#Accent#
R1Thumb=255,255,255,255
R1Track=#TrackColor#
R1Grab=#GrabColor#
R1Tile=124,92,230,255
R2Vol=0
R2Fill=#Accent#
R2Thumb=255,255,255,255
R2Track=#TrackColor#
R2Grab=#GrabColor#
R2Tile=124,92,230,255
R3Vol=0
R3Fill=#Accent#
R3Thumb=255,255,255,255
R3Track=#TrackColor#
R3Grab=#GrabColor#
R3Tile=124,92,230,255
R4Vol=0
R4Fill=#Accent#
R4Thumb=255,255,255,255
R4Track=#TrackColor#
R4Grab=#GrabColor#
R4Tile=124,92,230,255
R5Vol=0
R5Fill=#Accent#
R5Thumb=255,255,255,255
R5Track=#TrackColor#
R5Grab=#GrabColor#
R5Tile=124,92,230,255
R6Vol=0
R6Fill=#Accent#
R6Thumb=255,255,255,255
R6Track=#TrackColor#
R6Grab=#GrabColor#
R6Tile=124,92,230,255

; ---------- Data ----------

[WinAccent]
Measure=Registry
RegHKey=HKEY_CURRENT_USER
RegKey=Software\Microsoft\Windows\DWM
RegValue=AccentColor

[Mixer]
Measure=Script
ScriptFile=#CURRENTPATH#Scripts\Mixer.lua

; ---------- Styles shared by the row slots (see Rows.inc) ----------
; Each row has a gutter on the left (pin button on top, reorder grip below), then the icon, name and slider.

[StTile]
X=((#Pad#+#Gutter#)*#Scale#)
Hidden=1
DynamicVariables=1

[StGutterHit]
X=(#Pad#*#Scale#)
Hidden=1
DynamicVariables=1

[StPinGlyph]
X=((#Pad#+#Gutter#/2)*#Scale#)
StringAlign=CenterCenter
FontFace=#IconFont#
FontSize=(#PinSize#*#Scale#)
FontColor=#PinOffColor#
AntiAlias=1
Hidden=1
DynamicVariables=1

[StLetter]
X=((#Pad#+#Gutter#+#TileSize#/2)*#Scale#)
StringAlign=Center
FontFace=#Font#
FontSize=(#FontSize#*#Scale#)
FontWeight=700
FontColor=255,255,255,255
AntiAlias=1
Hidden=1
DynamicVariables=1

[StImg]
X=((#Pad#+#Gutter#+(#TileSize#-#ImgSize#)/2)*#Scale#)
W=(#ImgSize#*#Scale#)
H=(#ImgSize#*#Scale#)
PreserveAspectRatio=1
Hidden=1
DynamicVariables=1

[StName]
X=((#Pad#+#Gutter#+#SliderGap#)*#Scale#)
W=(#NameW#*#Scale#)
ClipString=1
FontFace=#Font#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
Hidden=1
DynamicVariables=1

[StPercent]
X=(#PercentX#*#Scale#)
StringAlign=Right
FontFace=#Font#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextDimColor#
AntiAlias=1
Hidden=1
DynamicVariables=1

[StSlider]
X=((#Pad#+#Gutter#+#SliderGap#)*#Scale#)
Hidden=1
DynamicVariables=1

[StHit]
; HitPad design px wider than the track on each side, so the thumb can be grabbed at 0 and 100 (see HIT_PAD in Mixer.lua)
X=((#Pad#+#Gutter#+#SliderGap#-#HitPad#)*#Scale#)
Shape=Rectangle 0,0,((#SliderW#+2*#HitPad#)*#Scale#),(#HitH#*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
Hidden=1
DynamicVariables=1

[StMute]
X=(#MuteX#*#Scale#)
StringAlign=Right
FontFace=#IconFont#
FontSize=(#IconSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
Hidden=1
DynamicVariables=1

; ---------- Background ----------

[Background]
Meter=Shape
Shape=Rectangle 0.5,0.5,(#PanelW#*#Scale#-1),(#PanelH#*#Scale#-1),(#Radius#*#Scale#) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
DynamicVariables=1

; ---------- Header ----------

[Grip]
Meter=Shape
X=(#Pad#*#Scale#)
Y=(#GripY#*#Scale#)
Shape=Ellipse (2*#Scale#),(2*#Scale#),(1.6*#Scale#) | Fill Color #TextDimColor# | StrokeWidth 0
Shape2=Ellipse (8*#Scale#),(2*#Scale#),(1.6*#Scale#) | Fill Color #TextDimColor# | StrokeWidth 0
Shape3=Ellipse (2*#Scale#),(8*#Scale#),(1.6*#Scale#) | Fill Color #TextDimColor# | StrokeWidth 0
Shape4=Ellipse (8*#Scale#),(8*#Scale#),(1.6*#Scale#) | Fill Color #TextDimColor# | StrokeWidth 0
Shape5=Ellipse (2*#Scale#),(14*#Scale#),(1.6*#Scale#) | Fill Color #TextDimColor# | StrokeWidth 0
Shape6=Ellipse (8*#Scale#),(14*#Scale#),(1.6*#Scale#) | Fill Color #TextDimColor# | StrokeWidth 0
DynamicVariables=1

; The only place the skin can be dragged from: dragging is switched on while the cursor is over it.
[GripHit]
Meter=Shape
X=(#GripHitX#*#Scale#)
Y=(#GripHitY#*#Scale#)
Shape=Rectangle 0,0,(#GripHitW#*#Scale#),(#GripHitH#*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
MouseOverAction=[!Draggable 1]
MouseLeaveAction=[!Draggable 0]
DynamicVariables=1

[Title]
Meter=String
Text=#TitleText#
X=((#Pad#+22)*#Scale#)
Y=(12*#Scale#)
FontFace=#Font#
FontSize=(#TitleFontSize#*#Scale#)
FontWeight=600
FontColor=#TextColor#
AntiAlias=1
DynamicVariables=1

[Close]
Meter=String
Text=#IconClose#
X=((#PanelW#-#Pad#-4)*#Scale#)
Y=(#CloseY#*#Scale#)
StringAlign=Right
FontFace=#IconFont#
FontSize=(#IconSize#*#Scale#)
FontColor=#TextDimColor#
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!DeactivateConfig]

; ---------- Master row ----------

[MasterName]
Meter=String
Text=
MouseScrollUpAction=[!CommandMeasure Mixer "Wheel(0,1)"]
MouseScrollDownAction=[!CommandMeasure Mixer "Wheel(0,-1)"]
X=((#Pad#+#Gutter#+#SliderGap#)*#Scale#)
Y=(#MasterNameY#*#Scale#)
W=(#MasterNameW#*#Scale#)
ClipString=1
FontFace=#Font#
FontSize=(#SmallFontSize#*#Scale#)
FontColor=#TextDimColor#
AntiAlias=1
DynamicVariables=1

[MasterIcon]
Meter=String
Text=#IconVolume#
LeftMouseDownAction=[!CommandMeasure Mixer "Down('mute',0)"]
LeftMouseUpAction=[!CommandMeasure Mixer "Click('mute',0)"]
MouseLeaveAction=[!CommandMeasure Mixer "Cancel()"]
X=((#Pad#+#Gutter#)*#Scale#)
Y=(#MasterIconY#*#Scale#)
FontFace=#IconFont#
FontSize=(#MasterIconSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
DynamicVariables=1

[MasterSlider]
Meter=Shape
X=((#Pad#+#Gutter#+#SliderGap#)*#Scale#)
Y=(#MasterSliderY#*#Scale#)
Shape=Rectangle 0,0,(#SliderW#*#Scale#),(6*#Scale#),(3*#Scale#) | Fill Color #TrackColor# | StrokeWidth 0
Shape2=Rectangle 0,0,(#SliderW#*#Scale#*#MasterVol#/100),(6*#Scale#),(3*#Scale#) | Fill Color #MasterFill# | StrokeWidth 0
Shape3=Ellipse (#SliderW#*#Scale#*#MasterVol#/100),(3*#Scale#),(7*#Scale#) | Fill Color 255,255,255,255 | StrokeWidth 0
DynamicVariables=1

[MasterHit]
Meter=Shape
MeterStyle=StHit
Hidden=0
Y=(#MasterHitY#*#Scale#)
LeftMouseDownAction=[!CommandMeasure Mixer "Press(0,$MouseX:%$)"]
MouseScrollUpAction=[!CommandMeasure Mixer "Wheel(0,1)"]
MouseScrollDownAction=[!CommandMeasure Mixer "Wheel(0,-1)"]

[MasterPercent]
Meter=String
Text=
MouseScrollUpAction=[!CommandMeasure Mixer "Wheel(0,1)"]
MouseScrollDownAction=[!CommandMeasure Mixer "Wheel(0,-1)"]
X=(#PercentX#*#Scale#)
Y=(#MasterPercentY#*#Scale#)
StringAlign=Right
FontFace=#Font#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
DynamicVariables=1

[Divider1]
Meter=Shape
Y=(#Divider1Y#*#Scale#)
Shape=Rectangle (#Pad#*#Scale#),0,((#PanelW#-2*#Pad#)*#Scale#),(1*#Scale#) | Fill Color #DividerColor# | StrokeWidth 0
DynamicVariables=1

; ---------- App rows ----------

@Include4=#CURRENTPATH#Rows.inc

[EmptyText]
Meter=String
Text=
X=(#Pad#*#Scale#)
Y=(#EmptyY#*#Scale#)
W=((#PanelW#-2*#Pad#)*#Scale#)
ClipString=1
FontFace=#Font#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextDimColor#
AntiAlias=1
Hidden=1
Group=Empty
DynamicVariables=1

; ---------- Footer: output buttons ----------

[Divider2]
Meter=Shape
Y=(#DividerY#*#Scale#)
Shape=Rectangle (#Pad#*#Scale#),0,((#PanelW#-2*#Pad#)*#Scale#),(1*#Scale#) | Fill Color #DividerColor# | StrokeWidth 0
DynamicVariables=1

[Out1]
Meter=Shape
LeftMouseDownAction=[!CommandMeasure Mixer "Down('output',1)"]
LeftMouseUpAction=[!CommandMeasure Mixer "Click('output',1)"]
MouseLeaveAction=[!CommandMeasure Mixer "Cancel()"]
X=(#Pad#*#Scale#)
Y=(#FooterY#*#Scale#)
Shape=Rectangle 0,0,(#ButtonW#*#Scale#),(#FooterH#*#Scale#),(#ButtonRadius#*#Scale#) | Fill Color #Out1Fill# | StrokeWidth 0
Hidden=1
Group=Out1
DynamicVariables=1

[Out1Label]
Meter=String
LeftMouseDownAction=[!CommandMeasure Mixer "Down('output',1)"]
LeftMouseUpAction=[!CommandMeasure Mixer "Click('output',1)"]
MouseLeaveAction=[!CommandMeasure Mixer "Cancel()"]
Text=
X=((#Pad#+#ButtonW#/2)*#Scale#)
Y=((#FooterY#+#ButtonTextY#)*#Scale#)
StringAlign=Center
FontFace=#Font#
FontSize=(#SmallFontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
Hidden=1
Group=Out1
DynamicVariables=1

[Out2]
Meter=Shape
LeftMouseDownAction=[!CommandMeasure Mixer "Down('output',2)"]
LeftMouseUpAction=[!CommandMeasure Mixer "Click('output',2)"]
MouseLeaveAction=[!CommandMeasure Mixer "Cancel()"]
X=((#Pad#+#ButtonW#+#ButtonGap#)*#Scale#)
Y=(#FooterY#*#Scale#)
Shape=Rectangle 0,0,(#ButtonW#*#Scale#),(#FooterH#*#Scale#),(#ButtonRadius#*#Scale#) | Fill Color #Out2Fill# | StrokeWidth 0
Hidden=1
Group=Out2
DynamicVariables=1

[Out2Label]
Meter=String
LeftMouseDownAction=[!CommandMeasure Mixer "Down('output',2)"]
LeftMouseUpAction=[!CommandMeasure Mixer "Click('output',2)"]
MouseLeaveAction=[!CommandMeasure Mixer "Cancel()"]
Text=
X=((#Pad#+#ButtonW#+#ButtonGap#+#ButtonW#/2)*#Scale#)
Y=((#FooterY#+#ButtonTextY#)*#Scale#)
StringAlign=Center
FontFace=#Font#
FontSize=(#SmallFontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
Hidden=1
Group=Out2
DynamicVariables=1

[Out3]
Meter=Shape
LeftMouseDownAction=[!CommandMeasure Mixer "Down('output',3)"]
LeftMouseUpAction=[!CommandMeasure Mixer "Click('output',3)"]
MouseLeaveAction=[!CommandMeasure Mixer "Cancel()"]
X=((#Pad#+2*(#ButtonW#+#ButtonGap#))*#Scale#)
Y=(#FooterY#*#Scale#)
Shape=Rectangle 0,0,(#ButtonW#*#Scale#),(#FooterH#*#Scale#),(#ButtonRadius#*#Scale#) | Fill Color #Out3Fill# | StrokeWidth 0
Hidden=1
Group=Out3
DynamicVariables=1

[Out3Label]
Meter=String
LeftMouseDownAction=[!CommandMeasure Mixer "Down('output',3)"]
LeftMouseUpAction=[!CommandMeasure Mixer "Click('output',3)"]
MouseLeaveAction=[!CommandMeasure Mixer "Cancel()"]
Text=
X=((#Pad#+2*(#ButtonW#+#ButtonGap#)+#ButtonW#/2)*#Scale#)
Y=((#FooterY#+#ButtonTextY#)*#Scale#)
StringAlign=Center
FontFace=#Font#
FontSize=(#SmallFontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
Hidden=1
Group=Out3
DynamicVariables=1
