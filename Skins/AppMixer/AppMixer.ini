; AppMixer - shows the real apps, volumes and active output from the helper's state file.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
; The skin can only be dragged by its handle (see [GripHit]), and the helper only runs while the skin is loaded.
OnRefreshAction=[!Draggable 0]["#CURRENTPATH#Helper\AppMixerHelper.exe" watch]
OnCloseAction=["#CURRENTPATH#Helper\AppMixerHelper.exe" stop]

@Include=#CURRENTPATH#Theme.inc

[Variables]
; Layout values that Mixer.lua recomputes from the number of rows
DividerY=272
FooterY=286

; Per-slot values that Mixer.lua sets
MasterVol=0
MasterFill=#Accent#
Out1Fill=#ButtonColor#
Out2Fill=#ButtonColor#
Out3Fill=#ButtonColor#
R1Vol=0
R1Fill=#Accent#
R1Thumb=255,255,255,255
R1Track=#TrackColor#
R1Tile=124,92,230,255
R2Vol=0
R2Fill=#Accent#
R2Thumb=255,255,255,255
R2Track=#TrackColor#
R2Tile=124,92,230,255
R3Vol=0
R3Fill=#Accent#
R3Thumb=255,255,255,255
R3Track=#TrackColor#
R3Tile=124,92,230,255
R4Vol=0
R4Fill=#Accent#
R4Thumb=255,255,255,255
R4Track=#TrackColor#
R4Tile=124,92,230,255
R5Vol=0
R5Fill=#Accent#
R5Thumb=255,255,255,255
R5Track=#TrackColor#
R5Tile=124,92,230,255
R6Vol=0
R6Fill=#Accent#
R6Thumb=255,255,255,255
R6Track=#TrackColor#
R6Tile=124,92,230,255

; ---------- Data ----------

[Mixer]
Measure=Script
ScriptFile=#CURRENTPATH#Scripts\Mixer.lua

; ---------- Styles shared by the row slots (see Rows.inc) ----------

[StTile]
X=(#Pad#*#Scale#)
Hidden=1
DynamicVariables=1

[StLetter]
X=((#Pad#+14)*#Scale#)
StringAlign=Center
FontFace=#Font#
FontSize=(#FontSize#*#Scale#)
FontWeight=700
FontColor=255,255,255,255
AntiAlias=1
Hidden=1
DynamicVariables=1

[StImg]
X=((#Pad#+2)*#Scale#)
W=(24*#Scale#)
H=(24*#Scale#)
PreserveAspectRatio=1
Hidden=1
DynamicVariables=1

[StName]
X=((#Pad#+40)*#Scale#)
W=(180*#Scale#)
ClipString=1
FontFace=#Font#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
Hidden=1
DynamicVariables=1

[StPercent]
X=(272*#Scale#)
StringAlign=Right
FontFace=#Font#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextDimColor#
AntiAlias=1
Hidden=1
DynamicVariables=1

[StSlider]
X=((#Pad#+40)*#Scale#)
Hidden=1
DynamicVariables=1

[StHit]
; 8 design px wider than the track on each side, so the thumb can be grabbed at 0 and 100 (see HIT_PAD in Mixer.lua)
X=((#Pad#+40-8)*#Scale#)
Shape=Rectangle 0,0,(224*#Scale#),(22*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
Hidden=1

[StMute]
X=(#PanelW#*#Scale#-#Pad#*#Scale#-4*#Scale#)
StringAlign=Right
FontFace=#IconFont#
FontSize=(#IconSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
Hidden=1
DynamicVariables=1

; ---------- Background ----------

[Background]
Meter=Shape
Shape=Rectangle 0.5,0.5,(#PanelW#*#Scale#-1),(#PanelH#*#Scale#-1),(#Radius#*#Scale#) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
DynamicVariables=1

; ---------- Header ----------

[Grip]
Meter=Shape
X=(#Pad#*#Scale#)
Y=(13*#Scale#)
Shape=Ellipse (2*#Scale#),(2*#Scale#),(1.6*#Scale#) | Fill Color #TextDimColor# | StrokeWidth 0
Shape2=Ellipse (8*#Scale#),(2*#Scale#),(1.6*#Scale#) | Fill Color #TextDimColor# | StrokeWidth 0
Shape3=Ellipse (2*#Scale#),(8*#Scale#),(1.6*#Scale#) | Fill Color #TextDimColor# | StrokeWidth 0
Shape4=Ellipse (8*#Scale#),(8*#Scale#),(1.6*#Scale#) | Fill Color #TextDimColor# | StrokeWidth 0
Shape5=Ellipse (2*#Scale#),(14*#Scale#),(1.6*#Scale#) | Fill Color #TextDimColor# | StrokeWidth 0
Shape6=Ellipse (8*#Scale#),(14*#Scale#),(1.6*#Scale#) | Fill Color #TextDimColor# | StrokeWidth 0
DynamicVariables=1

; The only place the skin can be dragged from: dragging is switched on while the cursor is over it.
[GripHit]
Meter=Shape
X=((#Pad#-8)*#Scale#)
Y=(4*#Scale#)
Shape=Rectangle 0,0,(28*#Scale#),(34*#Scale#) | Fill Color 0,0,0,1 | StrokeWidth 0
MouseOverAction=[!Draggable 1]
MouseLeaveAction=[!Draggable 0]
DynamicVariables=1

[Title]
Meter=String
Text=Volume
X=((#Pad#+22)*#Scale#)
Y=(12*#Scale#)
FontFace=#Font#
FontSize=(#TitleFontSize#*#Scale#)
FontWeight=600
FontColor=#TextColor#
AntiAlias=1
DynamicVariables=1

[Close]
Meter=String
Text=#IconClose#
X=((#PanelW#-#Pad#-4)*#Scale#)
Y=(14*#Scale#)
StringAlign=Right
FontFace=#IconFont#
FontSize=(#IconSize#*#Scale#)
FontColor=#TextDimColor#
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!DeactivateConfig]

; ---------- Master row ----------

[MasterName]
Meter=String
Text=
X=((#Pad#+40)*#Scale#)
Y=(50*#Scale#)
W=(190*#Scale#)
ClipString=1
FontFace=#Font#
FontSize=(#SmallFontSize#*#Scale#)
FontColor=#TextDimColor#
AntiAlias=1
DynamicVariables=1

[MasterIcon]
Meter=String
Text=#IconVolume#
X=(#Pad#*#Scale#)
Y=(76*#Scale#)
FontFace=#IconFont#
FontSize=(14*#Scale#)
FontColor=#TextColor#
AntiAlias=1
DynamicVariables=1

[MasterSlider]
Meter=Shape
X=((#Pad#+40)*#Scale#)
Y=(82*#Scale#)
Shape=Rectangle 0,0,(208*#Scale#),(6*#Scale#),(3*#Scale#) | Fill Color #TrackColor# | StrokeWidth 0
Shape2=Rectangle 0,0,(208*#Scale#*#MasterVol#/100),(6*#Scale#),(3*#Scale#) | Fill Color #MasterFill# | StrokeWidth 0
Shape3=Ellipse (208*#Scale#*#MasterVol#/100),(3*#Scale#),(7*#Scale#) | Fill Color 255,255,255,255 | StrokeWidth 0
DynamicVariables=1

[MasterHit]
Meter=Shape
MeterStyle=StHit
Hidden=0
Y=(74*#Scale#)
LeftMouseDownAction=[!CommandMeasure Mixer "Press(0,$MouseX:%$)"]
MouseScrollUpAction=[!CommandMeasure Mixer "Wheel(0,1)"]
MouseScrollDownAction=[!CommandMeasure Mixer "Wheel(0,-1)"]

[MasterPercent]
Meter=String
Text=
X=(272*#Scale#)
Y=(50*#Scale#)
StringAlign=Right
FontFace=#Font#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
DynamicVariables=1

[Divider1]
Meter=Shape
Y=(104*#Scale#)
Shape=Rectangle (#Pad#*#Scale#),0,((#PanelW#-2*#Pad#)*#Scale#),(1*#Scale#) | Fill Color #DividerColor# | StrokeWidth 0
DynamicVariables=1

; ---------- App rows ----------

@Include2=#CURRENTPATH#Rows.inc

[EmptyText]
Meter=String
Text=
X=(#Pad#*#Scale#)
Y=(128*#Scale#)
W=((#PanelW#-2*#Pad#)*#Scale#)
ClipString=1
FontFace=#Font#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextDimColor#
AntiAlias=1
Hidden=1
Group=Empty
DynamicVariables=1

; ---------- Footer: output buttons ----------

[Divider2]
Meter=Shape
Y=(#DividerY#*#Scale#)
Shape=Rectangle (#Pad#*#Scale#),0,((#PanelW#-2*#Pad#)*#Scale#),(1*#Scale#) | Fill Color #DividerColor# | StrokeWidth 0
DynamicVariables=1

[Out1]
Meter=Shape
X=(#Pad#*#Scale#)
Y=(#FooterY#*#Scale#)
Shape=Rectangle 0,0,(90*#Scale#),(36*#Scale#),(8*#Scale#) | Fill Color #Out1Fill# | StrokeWidth 0
Hidden=1
Group=Out1
DynamicVariables=1

[Out1Label]
Meter=String
Text=
X=((#Pad#+45)*#Scale#)
Y=((#FooterY#+9)*#Scale#)
StringAlign=Center
FontFace=#Font#
FontSize=(#SmallFontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
Hidden=1
Group=Out1
DynamicVariables=1

[Out2]
Meter=Shape
X=((#Pad#+99)*#Scale#)
Y=(#FooterY#*#Scale#)
Shape=Rectangle 0,0,(90*#Scale#),(36*#Scale#),(8*#Scale#) | Fill Color #Out2Fill# | StrokeWidth 0
Hidden=1
Group=Out2
DynamicVariables=1

[Out2Label]
Meter=String
Text=
X=((#Pad#+99+45)*#Scale#)
Y=((#FooterY#+9)*#Scale#)
StringAlign=Center
FontFace=#Font#
FontSize=(#SmallFontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
Hidden=1
Group=Out2
DynamicVariables=1

[Out3]
Meter=Shape
X=((#Pad#+198)*#Scale#)
Y=(#FooterY#*#Scale#)
Shape=Rectangle 0,0,(90*#Scale#),(36*#Scale#),(8*#Scale#) | Fill Color #Out3Fill# | StrokeWidth 0
Hidden=1
Group=Out3
DynamicVariables=1

[Out3Label]
Meter=String
Text=
X=((#Pad#+198+45)*#Scale#)
Y=((#FooterY#+9)*#Scale#)
StringAlign=Center
FontFace=#Font#
FontSize=(#SmallFontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
Hidden=1
Group=Out3
DynamicVariables=1
