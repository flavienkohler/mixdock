; AppMixer - Milestone 2: static panel with fake data. No audio yet.

[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
Blur=#Blur#
BlurRegion=2,0,0,(#PanelW#*#Scale#),(#PanelH#*#Scale#),(#Radius#*#Scale#)

@Include=#CURRENTPATH#Theme.inc

[Variables]
; Fake data for this milestone
MasterName=Speakers
MasterVol=62
Vol1=80
Vol2=40
Vol3=100
ActiveOutput=2

; ---------- Background ----------

[Background]
Meter=Shape
Shape=Rectangle 0.5,0.5,(#PanelW#*#Scale#-1),(#PanelH#*#Scale#-1),(#Radius#*#Scale#) | Fill Color #BgColor# | StrokeWidth 1 | Stroke Color #BorderColor#
DynamicVariables=1

; ---------- Header ----------

[Title]
Meter=String
Text=Volume
X=(#Pad#*#Scale#)
Y=(12*#Scale#)
FontFace=#Font#
FontSize=(#TitleFontSize#*#Scale#)
FontWeight=600
FontColor=#TextColor#
AntiAlias=1
DynamicVariables=1

[Close]
Meter=String
Text=#IconClose#
X=((#PanelW#-#Pad#-4)*#Scale#)
Y=(14*#Scale#)
StringAlign=Right
FontFace=#IconFont#
FontSize=(#IconSize#*#Scale#)
FontColor=#TextDimColor#
AntiAlias=1
DynamicVariables=1
LeftMouseUpAction=[!DeactivateConfig]

; ---------- Master row ----------

[MasterName]
Meter=String
Text=#MasterName#
X=((#Pad#+40)*#Scale#)
Y=(50*#Scale#)
FontFace=#Font#
FontSize=(#SmallFontSize#*#Scale#)
FontColor=#TextDimColor#
AntiAlias=1
DynamicVariables=1

[MasterIcon]
Meter=String
Text=#IconVolume#
X=(#Pad#*#Scale#)
Y=(76*#Scale#)
FontFace=#IconFont#
FontSize=(14*#Scale#)
FontColor=#TextColor#
AntiAlias=1
DynamicVariables=1

[MasterSlider]
Meter=Shape
X=((#Pad#+40)*#Scale#)
Y=(82*#Scale#)
Shape=Rectangle 0,0,(208*#Scale#),(6*#Scale#),(3*#Scale#) | Fill Color #TrackColor# | StrokeWidth 0
Shape2=Rectangle 0,0,(208*#Scale#*#MasterVol#/100),(6*#Scale#),(3*#Scale#) | Fill Color #Accent# | StrokeWidth 0
Shape3=Ellipse (208*#Scale#*#MasterVol#/100),(3*#Scale#),(7*#Scale#) | Fill Color 255,255,255,255 | StrokeWidth 0
DynamicVariables=1

[MasterPercent]
Meter=String
Text=#MasterVol#%
X=(272*#Scale#)
Y=(78*#Scale#)
StringAlign=Right
FontFace=#Font#
FontSize=(#FontSize#*#Scale#)
FontColor=#TextColor#
AntiAlias=1
DynamicVariables=1

[Divider1]
Meter=Shape
Y=(104*#Scale#)
Shape=Rectangle (#Pad#*#Scale#),0,((#PanelW#-2*#Pad#)*#Scale#),(1*#Scale#) | Fill Color #DividerColor# | StrokeWidth 0
DynamicVariables=1

